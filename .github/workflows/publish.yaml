# Publish new releases of masorange_rules_helm to the Bazel Central Registry.
#
# This replaces the legacy "Publish to BCR" GitHub App, which is being
# discontinued after 2026-06-30. The reusable workflow opens a pull request
# against `masmovil/bazel-central-registry` (the fork), which in turn targets
# `bazelbuild/bazel-central-registry`.
#
# Setup notes (one-time, outside this repo):
#   1. Create a fine-grained PAT (resource owner: the `masmovil` organization) with
#      repository access limited to `masmovil/bazel-central-registry` and the
#      `Contents: read and write` permission (Metadata: read is implicit). Save it as
#      repository secret `BCR_PUBLISH_TOKEN` and renew it before it expires.
#   2. Make sure `masmovil/bazel-central-registry` exists as a fork of
#      `bazelbuild/bazel-central-registry`. Only its `main` is covered by the
#      organization rulesets; the entry branches pushed by this workflow are not.
#
# Fine-grained PATs cannot open pull requests against repositories they do not own
# (https://github.com/github/roadmap/issues/600), so `open_pull_request` is false: the
# workflow pushes the entry branch to the fork and the "Open pull request manually" step
# of the publish job prints the URL that opens the PR against the BCR with one click.
# Open it as the release author: maintainers listed in the module's metadata.json get
# their entries approved automatically once the presubmit is green.
name: Publish

on:
  # Chained from release.yaml after the GitHub release is created.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  # Manual retry from the GitHub UI.
  workflow_dispatch:
    inputs:
      tag_name:
        description: a tag pointing to the commit being published
        required: true
        type: string

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.3.0
    with:
      tag_name: ${{ inputs.tag_name }}
      # GitHub repository (a fork of `bazelbuild/bazel-central-registry`)
      # where the publish-to-bcr bot pushes a branch and opens the PR.
      registry_fork: masmovil/bazel-central-registry
      draft: false
      # See the header: the fine-grained token can push the branch but not open the PR.
      open_pull_request: false
      # Skip attestation generation: our release.yaml uses
      # `softprops/action-gh-release@v2` directly rather than the
      # `release_ruleset.yaml` reusable workflow from bazel-contrib/.github,
      # so it does not upload an `<artifact>.intoto.jsonl` to the release.
      # With `attest: true` (the default), publish-to-bcr tries to fetch
      # that attestation from the release and fails with 404.
      # See https://github.com/bazel-contrib/publish-to-bcr/blob/v1.3.0/.github/workflows/publish.yaml#L62
      attest: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
